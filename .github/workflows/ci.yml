name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: |
          node --check index.js
          node --check typert.host.js
          node --check client.js
      - name: Host smoke test
        run: node test/host.test.mjs
      - name: Client smoke test
        run: node test/client-load.test.mjs
